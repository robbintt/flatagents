spec: flatmachine
spec_version: "2.0.0"

data:
  name: screen-agent-loop
  context:
    task: "{{ input.task }}"
    human_approved: false

  agents:
    screen_agent: ./agent.yml

  states:
    start:
      type: initial
      transitions:
        - to: work

    work:
      agent: screen_agent
      tool_loop:
        max_turns: 50
        max_tool_calls: 200
        max_cost: 5.00
        tool_timeout: 30
        total_timeout: 900
      input:
        task: "{{ context.task }}"
      output_to_context:
        result: "{{ output.content }}"
      transitions:
        - to: human_review

    human_review:
      action: human_review
      transitions:
        - condition: "context.human_approved == true"
          to: done
        - to: work

    done:
      type: final
      output:
        result: "{{ context.result }}"

metadata:
  description: "macOS screen automation agent with tool loop and human-in-the-loop review"
  tags: ["tool-use", "screen", "macos", "human-in-loop"]
