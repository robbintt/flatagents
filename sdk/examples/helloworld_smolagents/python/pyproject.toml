[project]
name = "helloworld-smolagents"
version = "0.1.0"
description = "'Hello, World!' demo for FlatMachine using smolagents subprocess bridge."
dependencies = ["flatmachines[flatagents,metrics]", "flatagents[litellm,metrics]", "smolagents"]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
helloworld-smolagents-demo = "helloworld_smolagents.main:main"
